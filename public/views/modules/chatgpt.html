<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Azure OpenAI</title>

    <!-- Bootstrap CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap ICONS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        /* Area de chat con scroll */
        .container-chat {
            height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.5rem 0;
        }

        /* Burbuja de texto base */
        .burbuja {
            max-width: 75%;
            padding: 0.6rem 0.9rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Burbuja del usuario */
        .burbuja-usuario {
            background-color: #0d6efd;
            color: white;
            border-bottom-right-radius: 0.2rem;
        }

        /* Burbuja del asistente */
        .burbuja-asistente {
            background-color: #ffffff;
            color: #212529;
            border: 1px solid #dee2e6;
            border-bottom-left-radius: 0.2rem;
        }

        /* Indicador de escritura animado */
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #6c757d;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Scroll al fondo automatico */
        .container-chat::-webkit-scrollbar { width: 5px; }
        .container-chat::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 5px; }
    </style>
</head>

<body class="bg-light">
    <main class="container">
        <button class="btn btn-sm btn-primary position-fixed top-0 start-0 m-3" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i>
            Atras
        </button>
        <div class="d-flex gap-2 justify-content-center">
            <!-- Container principal -->
            <div class="d-flex flex-column my-5 w-75 gap-3 container">

                <!-- Card del chat -->
                <div class="shadow">
                    <div class="card px-3">
                        <div class="card-body">
                            <h5 class="card-title fw-light">Chat con Azure OpenAI</h5>
                            <!-- Linea de separacion -->
                            <div class="shadow w-100 border my-2 mb-3"></div>

                            <!-- Area de mensajes (burbujas) -->
                            <div class="container-chat" id="container-chat">
                                <!-- Los mensajes se renderizan desde JS -->
                            </div>

                            <!-- Linea de separacion -->
                            <div class="shadow w-100 border my-2"></div>

                            <!-- Input del mensaje -->
                            <form id="form-text" class="d-flex gap-2 mt-3 align-items-end">
                                <textarea
                                    class="form-control"
                                    id="text-input"
                                    rows="2"
                                    placeholder="Escribe tu mensaje aqui..."
                                    required
                                    style="resize: none;"
                                ></textarea>
                                <button type="submit" class="btn btn-primary" id="btnEnviar" style="height: fit-content;">
                                    <i class="bi bi-send-fill"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
            <!-- Fin del main layout -->

            <aside class="w-25">
                <!-- Estadisticas -->
                <div class="shadow my-5">
                    <div class="card px-3">
                        <div class="card-body">
                            <h5 class="card-title fw-light">Estadisticas</h5>
                            <!-- Linea de separacion -->
                            <div class="shadow w-100 border my-2 mb-4"></div>

                            <!-- Tokens usados -->
                            <div class="text-center mb-4">
                                <h6 class="text-muted fw-light">Tokens usados</h6>
                                <span class="badge bg-primary fs-5 container-tokens">0</span>
                            </div>

                            <!-- Mensajes enviados -->
                            <div class="text-center">
                                <h6 class="text-muted fw-light">Mensajes</h6>
                                <span class="badge bg-secondary fs-5 container-mensajes">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Nueva conversacion -->
                <div class="shadow">
                    <div class="card px-3">
                        <div class="card-body">
                            <button class="btn btn-outline-secondary w-100" id="btnNuevo">
                                <i class="bi bi-arrow-counterclockwise"></i>
                                Nueva conversacion
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
            <!-- Fin del aside -->

        </div>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <!--  -->
    <script src="/src/chatgpt.js"></script>
</body>

</html>
